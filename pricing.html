<!DOCTYPE html>
<html lang="en" class="is-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Price List | ALBERTO Watch Company</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <section class="page-hero">
    <div class="page-hero-bg" style="background-image: url('https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?q=80&w=1600&auto=format&fit=crop');"></div>
    <div class="container page-hero-content">
      <span class="eyebrow">2026 International Tariff</span>
      <h1 class="page-hero-title">OFFICIAL WATCH PRICE LIST</h1>
      <p class="section-subtitle">
        Suggested retail valuations in USD across all 24 Alberto Manufacture timepieces. Includes 5-year international warranty and insured armored courier delivery.
      </p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="catalog-controls">
        <div class="catalog-inputs" style="width: 100%; justify-content: space-between;">
          <input type="text" id="pricing-search-input" class="luxury-input" placeholder="Search model or reference ID..." style="flex: 1;">
          <select id="pricing-category-select" class="luxury-select">
            <option value="all">Category: All Timepieces (24)</option>
            <option value="luxury">Luxury & Complications (8)</option>
            <option value="vintage">Vintage Heritage (4)</option>
            <option value="smartwatches">Chronos Smartwatches (4)</option>
            <option value="classic">Geneva Classic (4)</option>
            <option value="sports">Abyss & Vanguard Sport (4)</option>
          </select>
          <select id="pricing-sort-select" class="luxury-select">
            <option value="default">Sort: Manufacture Order</option>
            <option value="price-asc">Price: Lowest to Highest</option>
            <option value="price-desc">Price: Highest to Lowest</option>
          </select>
        </div>
      </div>

      <div class="pricing-table-wrap">
        <table class="pricing-table">
          <thead>
            <tr>
              <th>Preview</th>
              <th>Timepiece & Ref. ID</th>
              <th>Manufacture Line</th>
              <th>Category</th>
              <th>Valuation (USD)</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="pricing-table-body">
            <!-- Populated dynamically via main.js -->
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="assets/js/product-data.js"></script>
  <script src="assets/js/utilities.js"></script>
  <script src="assets/js/cursor.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/interactions.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
