<!DOCTYPE html>
<html lang="en" class="is-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronos Connected Smartwatches | ALBERTO Watch Company</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <section class="page-hero theme-smart">
    <div class="page-hero-bg" style="background-image: url('https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?q=80&w=1600&auto=format&fit=crop');"></div>
    <div class="container page-hero-content">
      <span class="eyebrow">Alberto Connected • Swiss OS</span>
      <h1 class="page-hero-title">CHRONOS SMARTWATCHES</h1>
      <p class="section-subtitle">
        Aerospace Grade 5 titanium and zirconia ceramic cases housing high-contrast sapphire AMOLED screens and precision biometric sensors.
      </p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="catalog-controls">
        <div id="catalog-result-count" style="font-size: 0.82rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-champagne);">
          Showing 4 Connected Timepieces
        </div>
        <div class="catalog-inputs">
          <input type="text" id="catalog-search-input" class="luxury-input" placeholder="Search connected watches...">
          <select id="catalog-sort-select" class="luxury-select">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
          </select>
        </div>
      </div>

      <div class="products-grid" id="smart-products-grid"></div>
    </div>
  </section>

  <script src="assets/js/product-data.js"></script>
  <script src="assets/js/utilities.js"></script>
  <script src="assets/js/cursor.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/interactions.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      new AlbertoCatalog({
        containerId: 'smart-products-grid',
        fixedCategory: 'smartwatches'
      });
    });
  </script>
</body>
</html>
